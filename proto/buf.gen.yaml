version: v2
#clean: true

inputs:
  - directory: .

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: ../gen/go
    opt:
      - paths=source_relative
      - simple
  - local: protoc-gen-go-enums
    out: ../gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-string-consts
    out: ../gen/go
    opt:
      - paths=source_relative

  - remote: buf.build/protocolbuffers/python:v36.1
    out: ../executor
  - remote: buf.build/protocolbuffers/pyi:v36.1
    out: ../executor
  - remote: buf.build/connectrpc/py:v0.11.1
    out: ../executor
    opt:
      - protobuf=google

managed:
  enabled: true
  disable:
    - path: vendor
      file_option: go_package_prefix
  override:
    - file_option: go_package_prefix
      value: github.com/qujing226/kvtide/gen/go
